name: Check landing page

on:
  pull_request:
    branches: [main]
  push:
    branches: ['feature/**', 'feat/**', 'fix/**']
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: landing-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Typecheck and static builds
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Check Svelte and TypeScript
        run: pnpm run check
      - name: Build at domain root
        run: pnpm run build
      - name: Verify root routes
        run: test -s build/index.html && test -s build/privacy/index.html
      - name: Build at repository prefix
        run: pnpm run build
        env:
          BASE_PATH: /grace-landing-page
      - name: Verify prefixed routes
        run: test -s build/index.html && test -s build/privacy/index.html
